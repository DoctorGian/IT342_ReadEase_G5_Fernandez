spring.application.name=readease

# Server Port
server.port=8080

# default to an embedded H2 database so the app can start without external DB
spring.datasource.url=jdbc:mysql://localhost:3306/dbit342_readease_g5_fernandez
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# Uncomment and configure the following block if you want to use MySQL instead
#spring.datasource.url=jdbc:mysql://localhost:3306/dbit342_fernandez
#spring.datasource.username=root
#spring.datasource.password=123456
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=my-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
jwt.expiration=86400000

